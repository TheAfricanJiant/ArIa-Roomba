<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Roomba Controller</title>
    <link rel="icon" type="image/png" href="./img/favicon.png">

    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div>
        <div class="header">
            <h1 class="arduino-text">ARIA Roomba Controller</h1>
            <img class="arduino-logo" src="./img/RGB-Arduino-Logo_Color Inline Loop.svg" alt="Arduino Logo">
        </div>

        <div class="container">
            <!-- LED Button with integrated text -->
            <div class="led-container">
                <button id="motor-power-btn" class="led-off">
                    <span id="power-text">MOTORS OFF</span>
                </button>
            </div>
            
            <p class="instruction-text" style="margin-bottom: 20px;">Click to toggle motors 👆</p>

            <div style="margin: 30px auto; max-width: 300px; text-align: left;">
                <label for="speed-slider" class="instruction-text" style="display: block; margin-bottom: 10px;">
                    <strong>Target Speed:</strong> <span id="speed-val">160</span>
                </label>
                <input type="range" id="speed-slider" min="0" max="255" value="160" style="width: 100%;">
            </div>

            <div style="margin-top: 40px; text-align: left; background: #DAE3E3; padding: 20px; border-radius: 8px;">
                <h3 class="arduino-text" style="font-size: 16px; margin-bottom: 15px;">Live Telemetry</h3>
                <p class="instruction-text"><strong>Encoder L:</strong> <span id="enc-l">0</span></p>
                <p class="instruction-text"><strong>Encoder R:</strong> <span id="enc-r">0</span></p>
                <p class="instruction-text"><strong>IMU Accel:</strong> <span id="imu-accel">X: 0.00 | Y: 0.00 | Z: 0.00</span></p>
                <p class="instruction-text"><strong>IMU Gyro:</strong> <span id="imu-gyro">X: 0.00 | Y: 0.00 | Z: 0.00</span></p>
            </div>

            <!-- Error message container -->
            <div id="error-container" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
